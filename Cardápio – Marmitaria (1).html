<html lang="pt-BR" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio – Bem Me Quer</title>
<style>
:root{--bg:#fbf5ea;--card:#fff;--tx:#2b1a14;--mut:#7a6458;--pri:#7b0d12;--onpri:#f3d27a;--gold:#c9972b;--ok:#1f9d55;--bd:#e8d9bf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0808;--card:#2a1111;--tx:#f5ebe0;--mut:#c0a99a;--pri:#e0b04a;--onpri:#2a0a0a;--bd:#4a2222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0808;--card:#2a1111;--tx:#f5ebe0;--mut:#c0a99a;--pri:#e0b04a;--onpri:#2a0a0a;--bd:#4a2222;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 18px;text-align:center;background:radial-gradient(circle at 50% 0,#6b0a0a,#3a0404);border-bottom:3px solid var(--gold)}
header img{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 8px;box-shadow:0 0 0 2px var(--gold)}
header h1{margin:0;font-size:24px;color:#f3d27a}
header p{margin:4px 0 0;color:#f3e3c0;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd);z-index:5}
nav a{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none;font-size:14px}
main{max-width:640px;margin:0 auto;padding:0 12px}
h2{margin:22px 4px 8px;font-size:19px;color:var(--pri)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item b{font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.item small{display:block;color:var(--mut);margin-top:3px;white-space:pre-line;line-height:1.35}
textarea{resize:vertical}
.op{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.op span.p{font-weight:600}
.op span.l{color:var(--mut);margin-right:6px}
.st{display:flex;align-items:center;gap:10px}
.st button{width:34px;height:34px;border-radius:50%;border:1px solid var(--pri);background:transparent;color:var(--pri);font-size:20px;line-height:1;cursor:pointer}
.st button.add{background:var(--pri);color:var(--onpri)}
.st em{min-width:18px;text-align:center;font-style:normal;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:6}
#bar button,.send{width:100%;max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font-size:17px;font-weight:600;padding:15px 18px;cursor:pointer}
.send{background:var(--ok);color:#fff;justify-content:center;margin-top:14px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
#box{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#box h3{margin:0 0 10px}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:15px}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:12px}
.x{float:right;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer}
#edbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:8;border:0;border-radius:99px;background:var(--tx);color:var(--bg);padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
#adm{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px))}
#adm .in{max-width:640px;margin:0 auto}
.cat{border:2px solid var(--bd);border-radius:14px;padding:12px;margin:16px 0}
.r{display:flex;gap:6px;margin-top:6px}
.r input:first-child{flex:1}.r input:nth-child(2){width:90px}
.sm{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px;cursor:pointer}
.sm.red{color:#c92a2a}
.sv{position:sticky;bottom:8px}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const R = v => "R$ " + (+v || 0).toFixed(2).replace(".", ",");
const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D = JSON.parse($("dados").textContent);
let qty = {}, info = {};

function render() {
  $("nome").textContent = D.nome; $("sub").textContent = D.sub; $("endr").textContent = D.end ? "📍 " + D.end : ""; document.title = "Cardápio – " + D.nome;
  let h = "", n = ""; info = {};
  D.menu.forEach((c, ci) => {
    n += `<a href="#c${ci}">${E(c.cat)}</a>`;
    h += `<h2 id="c${ci}">${E(c.cat)}</h2>`;
    c.itens.forEach((it, ii) => {
      h += `<div class="item"><b>${E(it.nome)}</b>${it.desc ? `<small>${E(it.desc)}</small>` : ""}`;
      it.op.forEach((o, oi) => {
        const k = `${ci}-${ii}-${oi}`;
        if (+o[1] > 0) info[k] = { nome: it.nome + (o[0] ? ` (${o[0]})` : ""), p: +o[1] };
        h += `<div class="op"><div>${o[0] ? `<span class="l">${E(o[0])}</span>` : ""}<span class="p">${+o[1] > 0 ? R(o[1]) : "Valor em breve"}</span></div><div class="st" id="s${k}"></div></div>`;
      });
      h += `</div>`;
    });
  });
  $("nav").innerHTML = n; $("menu").innerHTML = h;
  Object.keys(info).forEach(stepper);
  $("bai").innerHTML = (D.bairros || []).map((b, i) => `<option value="${i}">${E(b.n)} – ${R(b.t)}</option>`).join("");
}
const fee = () => $("ent").value === "Entrega" ? (+((D.bairros || [])[$("bai").value] || {}).t || 0) : 0;
function stepper(k) {
  const q = qty[k] || 0;
  $("s" + k).innerHTML = q
    ? `<button data-k="${k}" data-d="-1">−</button><em>${q}</em><button data-k="${k}" data-d="1">+</button>`
    : `<button class="add" data-k="${k}" data-d="1">+</button>`;
}
function total() { let t = 0, c = 0; for (const k in qty) { t += qty[k] * info[k].p; c += qty[k]; } return [t, c]; }
function refresh() {
  const [t, c] = total();
  $("bar").hidden = !c;
  $("qtd").textContent = `Ver pedido (${c} ${c === 1 ? "item" : "itens"})`;
  $("vt").textContent = R(t);
  if (!c) $("sheet").hidden = true;
  if (!$("sheet").hidden) sheet();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const k = b.dataset.k; qty[k] = Math.max(0, (qty[k] || 0) + +b.dataset.d);
  if (!qty[k]) delete qty[k];
  stepper(k); refresh();
});
function sheet() {
  const [t] = total(); const taxa = fee();
  $("lin").innerHTML = Object.keys(qty).map(k => `<div class="ln"><span>${qty[k]}x ${E(info[k].nome)}</span><span>${R(qty[k] * info[k].p)}</span></div>`).join("")
    + (taxa ? `<div class="ln"><span>Taxa de entrega</span><span>${R(taxa)}</span></div>` : "");
  $("tot").innerHTML = `<span>Total</span><span>${R(t + taxa)}</span>`;
  $("endw").hidden = $("ent").value !== "Entrega";
}
$("ver").onclick = () => { $("sheet").hidden = false; sheet(); };
$("fechar").onclick = () => $("sheet").hidden = true;
$("ent").onchange = sheet; $("bai").onchange = sheet;
$("env").onclick = () => {
  const nome = $("cn").value.trim(), ent = $("ent").value, end = $("end").value.trim();
  if (!nome) return alert("Por favor, informe seu nome.");
  if (ent === "Entrega" && !end) return alert("Por favor, informe o endereço de entrega.");
  const [t] = total(); const taxa = fee();
  let m = `*Novo pedido – ${D.nome}*\n\n*Cliente:* ${nome}\n\n*Itens:*\n`;
  Object.keys(qty).forEach(k => m += `• ${qty[k]}x ${info[k].nome} – ${R(qty[k] * info[k].p)}\n`);
  if (taxa) m += `• Taxa de entrega – ${R(taxa)}\n`;
  m += `\n*Total: ${R(t + taxa)}*\n\n*Recebimento:* ${ent}\n`;
  if (ent === "Entrega") m += `*Bairro:* ${((D.bairros || [])[$("bai").value] || {}).n || ""}\n*Endereço:* ${end}\n`;
  m += `*Pagamento:* ${$("pg").value}\n`;
  if ($("obs").value.trim()) m += `*Obs.:* ${$("obs").value.trim()}\n`;
  window.open(`https://wa.me/${D.wa}?text=${encodeURIComponent(m)}`, "_blank");
};
render();

/* ===== Modo dono: editar e publicar ===== */
let A = null, W = null;
const f = (l, p, v) => `<label>${l}</label><input data-p='${JSON.stringify(p)}' value="${E(v)}">`;
function ed() {
  let h = `<div class="in"><button class="x" data-a="sair" aria-label="Fechar">×</button><h3>Editar cardápio</h3>`
    + f("Nome da marmitaria", ["nome"], W.nome) + f("Frase embaixo do nome (ex.: horário)", ["sub"], W.sub) + f("Endereço", ["end"], W.end)
    + f("WhatsApp (55 + DDD + número, só números)", ["wa"], W.wa) + `<div class="cat"><label>Bairros de entrega e taxa (R$)</label>` + (W.bairros || []).map((b, i) => `<div class="r"><input placeholder="Bairro" data-p='${JSON.stringify(["bairros", i, "n"])}' value="${E(b.n)}"><input inputmode="decimal" placeholder="Taxa" data-p='${JSON.stringify(["bairros", i, "t"])}' value="${E(b.t)}"><button class="sm red" data-a="db" data-i="${i}">×</button></div>`).join("") + `<button class="sm" data-a="ab">+ novo bairro</button></div>`;
  W.menu.forEach((c, ci) => {
    h += `<div class="cat">` + f("Categoria", ["menu", ci, "cat"], c.cat);
    c.itens.forEach((it, ii) => {
      const b = ["menu", ci, "itens", ii];
      h += `<div class="item">` + f("Prato / item", [...b, "nome"], it.nome) + `<label>Descrição e ingredientes (pode usar várias linhas)</label><textarea rows="4" data-p='${JSON.stringify([...b, "desc"])}'>${E(it.desc)}</textarea>` + `<label>Tamanho (com peso aproximado, se quiser) e preço</label>`;
      it.op.forEach((o, oi) => h += `<div class="r"><input placeholder="Ex.: M · 450 g" data-p='${JSON.stringify([...b, "op", oi, 0])}' value="${E(o[0])}"><input inputmode="decimal" placeholder="Preço" data-p='${JSON.stringify([...b, "op", oi, 1])}' value="${E(o[1])}"><button class="sm red" data-a="do" data-i="${ci},${ii},${oi}">×</button></div>`);
      h += `<button class="sm" data-a="ao" data-i="${ci},${ii}">+ tamanho/preço</button> <button class="sm red" data-a="di" data-i="${ci},${ii}">Apagar item</button></div>`;
    });
    h += `<button class="sm" data-a="ai" data-i="${ci}">+ novo item</button> <button class="sm red" data-a="dc" data-i="${ci}">Apagar categoria</button></div>`;
  });
  h += `<button class="sm" data-a="ac">+ nova categoria</button><button class="send sv" data-a="salvar">Salvar e publicar</button></div>`;
  $("adm").innerHTML = h;
}
$("adm").addEventListener("input", e => {
  const p = e.target.dataset.p; if (!p) return;
  const path = JSON.parse(p); let o = W;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  const k = path[path.length - 1], v = e.target.value;
  o[k] = (k === 1 && Array.isArray(o)) || k === "taxa" || k === "t" ? parseFloat(String(v).replace(",", ".")) || 0 : v;
});
$("adm").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const a = b.dataset.a, [x, y, z] = (b.dataset.i || "").split(",").map(Number);
  if (a === "sair") { $("adm").hidden = true; return; }
  if (a === "ab") (W.bairros = W.bairros || []).push({ n: "", t: 0 });
  if (a === "db") W.bairros.splice(x, 1);
  if (a === "ac") W.menu.push({ cat: "Nova categoria", itens: [] });
  if (a === "dc" && confirm("Apagar esta categoria inteira?")) W.menu.splice(x, 1);
  if (a === "ai") W.menu[x].itens.push({ nome: "Novo item", desc: "", op: [["", 0]] });
  if (a === "di" && confirm("Apagar este item?")) W.menu[x].itens.splice(y, 1);
  if (a === "ao") W.menu[x].itens[y].op.push(["", 0]);
  if (a === "do") W.menu[x].itens[y].op.splice(z, 1);
  if (a === "salvar") {
    W.wa = String(W.wa).replace(/\D/g, "");
    W.menu.forEach(c => c.itens.forEach(i => { const k = i.op.filter(o => o[0] || o[1] > 0); if (k.length) i.op = k; }));
    W.bairros = (W.bairros || []).filter(b => b.n.trim());
    const c = document.documentElement.cloneNode(true);
    ["nav", "menu", "lin", "tot", "adm"].forEach(id => c.querySelector("#" + id).innerHTML = "");
    ["edbtn", "bar", "sheet", "adm"].forEach(id => c.querySelector("#" + id).setAttribute("hidden", ""));
    c.querySelector("#endw").removeAttribute("hidden");
    c.querySelector("#dados").textContent = JSON.stringify(W).replace(/</g, "\\u003c");
    b.textContent = "Salvando…";
    try { await A.publish("<!DOCTYPE html>\n" + c.outerHTML); }
    catch (err) { if (err && err.code !== "conflict") alert("Não consegui salvar: " + (err.message || err.code)); b.textContent = "Salvar e publicar"; }
    return;
  }
  ed();
});
$("edbtn").onclick = () => { W = JSON.parse(JSON.stringify(D)); ed(); $("adm").hidden = false; };
(async () => {
  try {
    if (!window.claude) return;
    const u = await claude.use("user");
    if (u && u.canEdit()) { A = await claude.use("artifact"); if (A) $("edbtn").hidden = false; }
  } catch (e) {}
})();
</script>
